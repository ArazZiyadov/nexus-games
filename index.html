<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Games | Azərbaycan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0e14;
            --card: #161b22;
            --accent: #00f2fe;
            --text: #e6edf3;
            --wa-color: #25D366;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            text-align: center;
        }

        nav {
            padding: 20px;
            background: rgba(13, 17, 23, 0.95);
            border-bottom: 1px solid #30363d;
            font-size: 24px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 2px;
        }

        .hero {
            padding: 80px 20px;
            background: radial-gradient(circle at center, rgba(0, 242, 254, 0.1) 0%, transparent 70%);
        }

        .hero h1 { font-size: 3rem; margin: 0; color: white; }
        .hero p { color: #8b949e; font-size: 1.2rem; }

        .games-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            padding: 40px;
        }

        .game-card {
            background: var(--card);
            border-radius: 25px;
            border: 1px solid #30363d;
            width: 280px;
            padding: 30px;
            transition: 0.3s;
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.2);
        }

        .game-icon { font-size: 50px; color: var(--accent); margin-bottom: 20px; }

        .play-btn {
            display: block;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            color: #000;
            padding: 15px;
            text-decoration: none;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 20px;
        }

        .support-box {
            margin: 60px 20px;
            padding: 40px;
            background: #161b22;
            border-radius: 30px;
            border: 2px dashed var(--wa-color);
        }

        .wa-btn {
            display: inline-block;
            background: var(--wa-color);
            color: white;
            padding: 18px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.2);
        }

        footer { padding: 40px; color: #484f58; font-size: 0.9rem; }
    </style>
</head>
<body>

    <nav>NEXUS GAMES</nav>

    <div class="hero">
        <h1>Oyun Dünyası</h1>
        <p>Sürətli, pulsuz və maraqlı mini oyunlar.</p>
    </div>

    <div class="games-grid">
        <div class="game-card">
            <div class="game-icon"><i class="fas fa-mouse-pointer"></i></div>
            <h3>Core Clicker</h3>
            <p style="color: #8b949e;">Ekrana klikləyərək ən yüksək xalı topla!</p>
            <a href="clicker.html" class="play-btn">OYNA</a>
        </div>
    </div>

    <div class="support-box">
        <h2 style="color: var(--wa-color);">Bizə Dəstək Ol 🚀</h2>
        <p style="color: #8b949e;">Yeni oyunların gəlməsi üçün mənə WhatsApp-dan yazaraq dəstək ola bilərsən!</p>
        
        <a href="https://wa.me/994515114568?text=Salam,NexusGames-e-destek-olmaq-isteyirem" 
           target="_blank" class="wa-btn">
            <i class="fab fa-whatsapp"></i> WhatsApp ilə Yaz
        </a>
    </div>

    <footer>
        &copy; 2026 Nexus Games Azerbaijan.
    </footer>

</body>
</html>
